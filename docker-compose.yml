# Local Neo4j for the GraphRAG backend. Same Cypher runs on Neo4j AuraDB Free
# (set NEO4J_URI=neo4j+s://<id>.databases.neo4j.io and credentials in .env).
services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474" # Browser UI
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/filmgraph-local
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512M
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
