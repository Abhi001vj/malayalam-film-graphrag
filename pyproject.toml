[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "malayalam-film-graphrag"
version = "0.2.0"
description = "Source-grounded graph and story search for Malayalam cinema"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12,<5", "numpy>=1.26"]

[project.optional-dependencies]
vectors = ["sentence-transformers>=3,<6"]
neo4j = ["neo4j>=5,<7"]
graphrag = ["scikit-learn>=1.4", "networkx>=3.2", "neo4j>=5,<7"]

[project.scripts]
filmgraph = "filmgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
filmgraph = ["static/*", "models/*"]

